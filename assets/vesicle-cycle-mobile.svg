<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1112" viewBox="0 0 440 1112" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">The synaptic vesicle cycle — mobile</title>
  <desc id="desc">Three readable animated panels: vesicle motion and synapsin-associated organization, calcium-triggered exocytosis, and membrane retrieval with recycling. This is a simplified conceptual illustration, not a simulation output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="440" y2="1112" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#14192F"/></linearGradient>
    <g id="sv"><circle r="22" fill="#FFD84D" fill-opacity=".08" stroke="#FFD84D" stroke-width="2.5"/><circle r="17" stroke="#FFEAAF" stroke-opacity=".55"/><g fill="#FFD84D"><circle cx="-6" cy="-4" r="2.8"/><circle cx="6" cy="-2" r="2.8"/><circle cy="7" r="2.8"/></g></g>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L6 3.5L0 7" stroke="#53D8FF" stroke-width="1.2"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,Menlo,monospace}.drift-a{animation:driftA 6s ease-in-out infinite}.drift-b{animation:driftB 4s ease-in-out infinite}.links{animation:links 6s ease-in-out infinite}
      .docked,.bridge{opacity:0;animation:dock 12s linear infinite}.fusion{animation:fuse 12s linear infinite}.calcium{animation:calcium 12s linear infinite both}.calcium-b{animation-delay:.45s}.release-a{animation:releaseA 12s linear infinite}.release-b{animation:releaseB 12s linear infinite}.release-c{animation:releaseC 12s linear infinite}.bud{transform:translate(0,-50px);animation:bud 12s ease-in-out infinite}.retrieval{animation:retrieval 12s linear infinite}
      @keyframes driftA{0%,100%{transform:translate(0,0)}25%{transform:translate(4px,-6px)}55%{transform:translate(-3px,3px)}80%{transform:translate(2px,5px)}}@keyframes driftB{0%,100%{transform:translate(0,0)}27%{transform:translate(-5px,2px)}62%{transform:translate(3px,-5px)}82%{transform:translate(5px,3px)}}@keyframes links{0%,100%{opacity:.5}50%{opacity:1}}
      @keyframes dock{0%,24%,80%,100%{opacity:1}30%,73%{opacity:0}}@keyframes fuse{0%,24%,73%,100%{opacity:0}30%,65%{opacity:1}}
      @keyframes calcium{0%,12%,42%,100%{opacity:0;transform:translate(0,0)}16%{opacity:1;transform:translate(0,0)}32%{opacity:1;transform:translate(0,-105px)}36%{opacity:0;transform:translate(0,-105px)}}
      @keyframes releaseA{0%,33%,100%{opacity:0;transform:translate(0,0)}36%{opacity:1;transform:translate(0,0)}60%{opacity:0;transform:translate(-26px,22px)}}@keyframes releaseB{0%,36%,100%{opacity:0;transform:translate(0,0)}39%{opacity:1;transform:translate(0,0)}63%{opacity:0;transform:translate(0,18px)}}@keyframes releaseC{0%,39%,100%{opacity:0;transform:translate(0,0)}42%{opacity:1;transform:translate(0,0)}66%{opacity:0;transform:translate(27px,21px)}}
      @keyframes bud{0%,65%,100%{opacity:0;transform:translate(0,0)}73%{opacity:1;transform:translate(0,0)}88%{opacity:1;transform:translate(0,-64px)}96%{opacity:0;transform:translate(0,-64px)}}@keyframes retrieval{0%,66%,100%{opacity:1}76%,94%{opacity:.25}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}.docked,.bridge{opacity:0}.fusion,.calcium,.release-a,.release-b,.release-c,.bud{opacity:1}.bud{transform:translate(0,-50px)}}
    </style>
  </defs>
  <rect x="1" y="1" width="438" height="1110" rx="21" fill="url(#bg)" stroke="#2B3357" stroke-width="2"/>
  <circle cx="29" cy="30" r="4.5" fill="#FF6B6B"/><circle cx="46" cy="30" r="4.5" fill="#FFD166"/><circle cx="63" cy="30" r="4.5" fill="#2ED573"/><text x="85" y="37" fill="#F4F7FF" class="mono" font-size="20" font-weight="700">vesicle_cycle.svg</text><text x="22" y="67" fill="#FFD84D" class="mono" font-size="13">ONE CYCLE · MANY QUESTIONS</text>
  <g transform="translate(22 84)" data-panel="organization">
    <rect data-panel-boundary="true" width="396" height="314" rx="14" fill="#141B2B" stroke="#5A4A26"/>
    <text x="18" y="25" fill="#FFD84D" class="mono" font-size="14">01 / RESEARCH FOCUS</text><text x="18" y="56" fill="#F4F7FF" font-size="25" font-weight="700">Move &amp; organize</text>
    <ellipse cx="198" cy="159" rx="146" ry="79" fill="#FFD84D" fill-opacity=".025" stroke="#FFD84D" stroke-opacity=".2" stroke-dasharray="4 7"/>
    <g class="links" stroke="#B176FF" stroke-width="2" stroke-dasharray="3 4"><path d="M121 145L155 126M183 129L213 145M133 168L154 194M181 199L235 193M253 168L269 138"/><g fill="#B176FF" stroke="none"><circle cx="139" cy="136" r="4.5"/><circle cx="199" cy="137" r="4.5"/><circle cx="144" cy="181" r="4.5"/><circle cx="207" cy="196" r="4.5"/><circle cx="261" cy="153" r="4.5"/></g></g>
    <g transform="translate(100 153)"><g class="drift-a"><use href="#sv"/></g></g><g transform="translate(175 118)"><g class="drift-b"><use href="#sv"/></g></g><g transform="translate(234 155)"><g class="drift-a"><use href="#sv"/></g></g><g transform="translate(281 117)"><g class="drift-b"><use href="#sv"/></g></g><g transform="translate(166 205)"><g class="drift-b"><use href="#sv"/></g></g><g transform="translate(256 199)"><g class="drift-a"><use href="#sv"/></g></g>
    <text x="18" y="270" fill="#FFEAAF" font-size="20">Vesicles + synapsin</text><text x="18" y="297" fill="#A7B1D8" font-size="16">Motion · interactions · organization</text>
  </g>
  <g transform="translate(22 412)" data-panel="exocytosis">
    <rect data-panel-boundary="true" width="396" height="314" rx="14" fill="#19192C" stroke="#56314D"/>
    <text x="18" y="25" fill="#FF8FD8" class="mono" font-size="14">02 / BIOLOGICAL CONTEXT</text><text x="18" y="56" fill="#F4F7FF" font-size="25" font-weight="700">Dock → fuse → release</text>
    <rect x="20" y="78" width="356" height="129" rx="10" fill="#0B1120"/>
    <path d="M20 205H142M214 205H376M20 212H142M214 212H376" stroke="#8A8BFF" stroke-width="2.5"/><path d="M138 205H215" stroke="#FF8FD8" stroke-width="5" class="bridge"/>
    <g transform="translate(176 180)" class="docked"><use href="#sv"/></g><path class="fusion" d="M139 205H151C159 205 159 199 154 193C136 170 150 143 176 143C202 143 216 170 198 193C193 199 193 205 201 205H216" stroke="#FFD84D" stroke-width="3" stroke-linecap="round" fill="#FFD84D" fill-opacity=".05"/>
    <rect x="279" y="197" width="15" height="24" rx="4" fill="#142A3B" stroke="#53D8FF" stroke-width="2"/><path d="M287 248V157" stroke="#53D8FF" stroke-opacity=".35" stroke-dasharray="3 5" marker-end="url(#arrow)"/><text x="305" y="173" fill="#53D8FF" font-size="19">Ca²⁺</text><circle cx="285" cy="236" r="5" fill="#53D8FF" class="calcium"/><circle cx="289" cy="241" r="4" fill="#A7EEFF" class="calcium calcium-b"/>
    <circle cx="170" cy="215" r="4" fill="#FFD84D" class="release-a"/><circle cx="178" cy="222" r="3.5" fill="#FFEAAF" class="release-b"/><circle cx="183" cy="217" r="3.5" fill="#FFD84D" class="release-c"/>
    <text x="20" y="238" fill="#8290B5" font-size="13">synaptic cleft</text>
    <text x="18" y="270" fill="#FFB8E7" font-size="20">Ca²⁺-triggered exocytosis</text><text x="18" y="297" fill="#A7B1D8" font-size="16">Docking · priming · membrane fusion</text>
  </g>
  <g transform="translate(22 740)" data-panel="recycling">
    <rect data-panel-boundary="true" width="396" height="314" rx="14" fill="#14231F" stroke="#345B48"/>
    <text x="18" y="25" fill="#8FFFA3" class="mono" font-size="14">03 / BIOLOGICAL CONTEXT</text><text x="18" y="56" fill="#F4F7FF" font-size="25" font-weight="700">Recycle &amp; reuse</text>
    <path d="M20 205H147C157 205 159 196 158 185C156 168 167 154 185 154C204 154 215 168 212 185C211 196 217 205 226 205H376" stroke="#8FFFA3" stroke-width="3" class="retrieval"/><path d="M20 212H144M230 212H376" stroke="#8FFFA3" stroke-opacity=".45" stroke-width="2"/>
    <g class="bud"><g transform="translate(185 172)"><use href="#sv"/></g></g><path d="M287 193C311 160 300 127 270 118" stroke="#8FFFA3" stroke-opacity=".6" stroke-width="2" stroke-dasharray="4 5"/><path d="M280 113L268 118L275 128" stroke="#8FFFA3" stroke-width="2"/>
    <text x="18" y="270" fill="#B7FFC5" font-size="20">Membrane retrieval + recycling</text><text x="18" y="297" fill="#A7B1D8" font-size="16">Endocytosis · reformation · refilling</text>
  </g>
  <text x="22" y="1078" fill="#A7B1D8" font-size="13">Conceptual cycle · not to scale</text><text x="22" y="1098" fill="#A7B1D8" font-size="13">Recycling routes and timings are simplified.</text>
</svg>
