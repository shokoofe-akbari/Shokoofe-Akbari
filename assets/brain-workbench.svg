    <g>
      <rect x="26" y="82" width="396" height="137" rx="12" fill="#13192C" stroke="#554624"/>
      <rect x="26" y="105" width="3" height="87" rx="1.5" fill="#FFD84D"/>
      <text x="47" y="112" fill="#FFD84D" font-size="12" letter-spacing="1.1">01 / RESEARCH</text>
      <text x="47" y="149" fill="#F4F7FF" font-size="22" font-weight="700">Tiny vesicles. Big questions.</text>
      <text x="47" y="181" fill="#A7B1D8" font-size="13">Mechanisms · models · numerical evidence</text>
      <text x="395" y="204" text-anchor="end" fill="#FFD84D" font-size="10">KEEP ASKING WHY ↗</text>
    </g>
    <g>
      <rect x="442" y="82" width="396" height="137" rx="12" fill="#111D2B" stroke="#284759"/>
      <rect x="442" y="105" width="3" height="87" rx="1.5" fill="#53D8FF"/>
      <text x="463" y="112" fill="#53D8FF" font-size="12" letter-spacing="1.1">02 / BUILD</text>
      <text x="463" y="149" fill="#F4F7FF" font-size="22" font-weight="700">Ideas with source code.</text>
      <text x="463" y="181" fill="#A7B1D8" font-size="13">C++ · Python · scientific tools</text>
      <text x="811" y="204" text-anchor="end" fill="#53D8FF" font-size="10">MAKE IT INSPECTABLE ↗</text>
    </g>
    <g>
      <rect x="858" y="82" width="396" height="137" rx="12" fill="#20182F" stroke="#4A355E"/>
      <rect x="858" y="105" width="3" height="87" rx="1.5" fill="#B176FF"/>
      <text x="879" y="112" fill="#C8A2FF" font-size="12" letter-spacing="1.1">03 / TEACH</text>
      <text x="879" y="149" fill="#F4F7FF" font-size="22" font-weight="700">Make the concept click.</text>
      <text x="879" y="181" fill="#A7B1D8" font-size="13">Git · GitHub · AI · practical learning</text>
      <text x="1227" y="204" text-anchor="end" fill="#C8A2FF" font-size="10">EXPLAIN THE WHY ↗</text>
    </g>
    <g>
      <rect x="26" y="237" width="396" height="137" rx="12" fill="#182820" stroke="#345845"/>
      <rect x="26" y="260" width="3" height="87" rx="1.5" fill="#8FFFA3"/>
