      <text x="879" y="304" fill="#F4F7FF" font-size="22" font-weight="700">Give ideas a good page.</text>
      <text x="879" y="336" fill="#A7B1D8" font-size="13">Models · LaTeX · manuscripts · book ideas</text>
      <text x="1227" y="359" text-anchor="end" fill="#FDBA74" font-size="10">REFINE THE EXPLANATION ↗</text>
