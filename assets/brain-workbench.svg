    <text x="99" y="39" fill="#F4F7FF" font-size="18" font-weight="700">shokoofeh.workspace</text>
    <text x="1248" y="39" text-anchor="end" fill="#FFD84D" font-size="12" letter-spacing="1.2">MANY IDEAS // DETAILS INCLUDED</text>
