      <rect x="442" y="260" width="3" height="87" rx="1.5" fill="#FF8FD8"/>
      <text x="463" y="267" fill="#FF8FD8" font-size="12" letter-spacing="1.1">05 / CREATE</text>
      <text x="463" y="304" fill="#F4F7FF" font-size="22" font-weight="700">Science with a visual voice.</text>
      <text x="463" y="336" fill="#A7B1D8" font-size="13">BugCharm · dark themes · clear stories</text>
      <text x="811" y="359" text-anchor="end" fill="#FF8FD8" font-size="10">EVERY LABEL MATTERS ↗</text>
