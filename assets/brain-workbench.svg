<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="434" viewBox="0 0 1280 434" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Shokoofeh's workbench — many ideas, details included</title>
  <desc id="desc">Six interconnected areas of work: research, programming, teaching, learning, content creation, and writing. This is a personal illustrated workspace, not a report of measured activity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="434" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#14192F"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1280" y2="434" gradientUnits="userSpaceOnUse"><stop stop-color="#FFD84D"/><stop offset="0.48" stop-color="#B176FF"/><stop offset="1" stop-color="#53D8FF"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#A7B1D8" stroke-opacity="0.04"/></pattern>
  </defs>
  <rect x="1" y="1" width="1278" height="432" rx="22" fill="url(#bg)" stroke="#2B3357" stroke-width="2"/>
  <rect x="2" y="2" width="1276" height="430" rx="21" fill="url(#grid)"/>
  <g font-family="Consolas, Menlo, monospace">
