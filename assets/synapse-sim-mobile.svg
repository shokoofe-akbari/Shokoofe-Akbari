<svg xmlns="http://www.w3.org/2000/svg" width="440" height="636" viewBox="0 0 440 636" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Shokoofeh's synaptic vesicle lab — mobile</title>
  <desc id="desc">A readable mobile illustration of a presynaptic terminal, gold synaptic vesicles, purple synapsin, docked vesicles, and a pink active zone. Gentle motion is conceptual, not a measured trajectory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="440" y2="636" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#14192F"/></linearGradient>
    <linearGradient id="membrane" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#777AFF"/><stop offset=".5" stop-color="#B176FF"/><stop offset="1" stop-color="#53D8FF"/></linearGradient>
    <g id="sv"><circle r="21" fill="#FFD84D" fill-opacity=".09" stroke="#FFD84D" stroke-width="2.5"/><circle r="16.5" stroke="#FFEAAF" stroke-opacity=".55"/><circle cx="-6" cy="-4" r="2.5" fill="#FFD84D"/><circle cx="6" cy="-2" r="2.5" fill="#FFD84D"/><circle cy="7" r="2.5" fill="#FFD84D"/></g>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,Menlo,monospace}.drift-a{animation:driftA 6s ease-in-out infinite}.drift-b{animation:driftB 4s ease-in-out infinite}.links{animation:links 6s ease-in-out infinite}.cursor{animation:cursor 1.5s step-end infinite}
      @keyframes driftA{0%,100%{transform:translate(0,0)}25%{transform:translate(4px,-6px)}55%{transform:translate(-3px,3px)}80%{transform:translate(2px,5px)}}@keyframes driftB{0%,100%{transform:translate(0,0)}27%{transform:translate(-5px,2px)}62%{transform:translate(3px,-5px)}82%{transform:translate(5px,3px)}}@keyframes links{0%,100%{opacity:.5}50%{opacity:1}}@keyframes cursor{0%,100%{opacity:1}50%{opacity:0}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect x="1" y="1" width="438" height="634" rx="22" fill="url(#bg)" stroke="#2B3357" stroke-width="2"/>
  <g data-panel="header"><rect data-panel-boundary="true" x="16" y="16" width="408" height="67" rx="13" fill="#1B223D"/><circle cx="31" cy="36" r="4" fill="#FF6B6B"/><circle cx="45" cy="36" r="4" fill="#FFD166"/><circle cx="59" cy="36" r="4" fill="#2ED573"/><text x="77" y="43" fill="#F4F7FF" font-size="24" font-weight="700">synapse_sim.cpp</text><text x="31" y="69" fill="#FFD84D" class="mono" font-size="16">SYNAPTIC VESICLE LAB</text></g>
  <g data-panel="terminal">
    <rect data-panel-boundary="true" x="18" y="98" width="404" height="391" rx="15" fill="#101629" stroke="#303B60"/>
    <text x="36" y="131" fill="#F4F7FF" font-size="21" font-weight="700">Presynaptic terminal</text>
    <path d="M38 390V259C38 189 101 168 171 168H270C348 168 401 205 401 274V390Z" fill="#0B1120" stroke="#3A466C" stroke-width="2"/>
    <text x="51" y="195" fill="#FFEAAF" font-size="18">Vesicle pool</text>
    <g class="links" stroke="#B176FF" stroke-width="2" stroke-dasharray="3 4"><path d="M113 237L156 218M191 220L215 235M172 273L211 283M247 253L298 239"/><g fill="#B176FF" stroke="none"><circle cx="137" cy="227" r="4.5"/><circle cx="203" cy="227" r="4.5"/><circle cx="191" cy="278" r="4.5"/><circle cx="274" cy="246" r="4.5"/></g></g>
    <g transform="translate(92 237)"><g class="drift-a"><use href="#sv"/></g></g><g transform="translate(175 214)"><g class="drift-b"><use href="#sv"/></g></g><g transform="translate(237 242)"><g class="drift-a"><use href="#sv"/></g></g><g transform="translate(320 231)"><g class="drift-b"><use href="#sv"/></g></g><g transform="translate(151 282)"><g class="drift-b"><use href="#sv"/></g></g><g transform="translate(230 292)"><g class="drift-a"><use href="#sv"/></g></g>
    <text x="289" y="320" fill="#C8A2FF" font-size="19">Synapsin</text><path d="M291 303L274 258" stroke="#B176FF" stroke-opacity=".7"/>
    <g transform="translate(194 365)"><use href="#sv"/></g><g transform="translate(268 365)"><use href="#sv"/></g>
    <path d="M38 390H401M38 397H401" stroke="url(#membrane)" stroke-width="3"/><path d="M158 390H298" stroke="#FF8FD8" stroke-width="6" stroke-linecap="round"/>
    <text x="56" y="445" fill="#FFB8E7" font-size="19">Active zone</text><path d="M143 429L196 403" stroke="#FF8FD8" stroke-opacity=".7"/>
    <text x="307" y="445" fill="#A7B1D8" font-size="18" text-anchor="middle">Membrane</text><path d="M323 425L360 405" stroke="#8998C3" stroke-opacity=".7"/>
    <text x="36" y="474" fill="#A7B1D8" font-size="15">Not to scale · illustrative motion</text>
  </g>
  <circle cx="28" cy="525" r="8" stroke="#FFD84D" stroke-width="2"/><circle cx="28" cy="525" r="4.5" stroke="#FFEAAF" stroke-opacity=".6"/><text x="43" y="531" fill="#FFEAAF" font-size="17">synaptic vesicle</text><circle cx="247" cy="525" r="5" fill="#B176FF"/><text x="261" y="531" fill="#C8A2FF" font-size="17">synapsin</text>
  <g data-panel="console"><rect data-panel-boundary="true" x="18" y="554" width="404" height="65" rx="13" fill="#101629" stroke="#303B60"/><text x="33" y="580" fill="#8FFFA3" class="mono" font-size="16">shokoofeh@lab:~$</text><text x="33" y="605" fill="#B4C0E9" class="mono" font-size="16">inspect vesicle-cycle</text><rect x="214" y="591" width="8" height="17" rx="1" fill="#FFD84D" class="cursor"/></g>
</svg>
