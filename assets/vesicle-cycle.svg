<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">The synaptic vesicle cycle — three animated views</title>
  <desc id="desc">A conceptual cycle: vesicle motion and synapsin-associated organization, calcium-triggered exocytosis at the active zone, and membrane retrieval with vesicle recycling. Gold rings are vesicles, purple dots are synapsin, cyan dots are calcium ions, and released gold dots are neurotransmitter. Docking, priming, fusion, endocytosis, reformation and refilling are simplified; no particular recycling route, trajectory or rate is claimed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#14192F"/></linearGradient>
    <g id="sv"><circle r="22" fill="#FFD84D" fill-opacity=".08" stroke="#FFD84D" stroke-width="2.5"/><circle r="17" stroke="#FFEAAF" stroke-opacity=".55"/><g fill="#FFD84D"><circle cx="-6" cy="-4" r="2.8"/><circle cx="6" cy="-2" r="2.8"/><circle cy="7" r="2.8"/></g></g>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0L6 3.5L0 7" stroke="#53D8FF" stroke-width="1.2"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,Menlo,monospace}.drift-a{animation:driftA 6s ease-in-out infinite}.drift-b{animation:driftB 4s ease-in-out infinite}.links{animation:links 6s ease-in-out infinite}
      .docked,.bridge{opacity:0;animation:dock 12s linear infinite}.fusion{animation:fuse 12s linear infinite}.calcium{animation:calcium 12s linear infinite both}.calcium-b{animation-delay:.45s}.release-a{animation:releaseA 12s linear infinite}.release-b{animation:releaseB 12s linear infinite}.release-c{animation:releaseC 12s linear infinite}.bud{transform:translate(0,-50px);animation:bud 12s ease-in-out infinite}.retrieval{animation:retrieval 12s linear infinite}
      @keyframes driftA{0%,100%{transform:translate(0,0)}25%{transform:translate(4px,-6px)}55%{transform:translate(-3px,3px)}80%{transform:translate(2px,5px)}}@keyframes driftB{0%,100%{transform:translate(0,0)}27%{transform:translate(-5px,2px)}62%{transform:translate(3px,-5px)}82%{transform:translate(5px,3px)}}@keyframes links{0%,100%{opacity:.5}50%{opacity:1}}
      @keyframes dock{0%,24%,80%,100%{opacity:1}30%,73%{opacity:0}}@keyframes fuse{0%,24%,73%,100%{opacity:0}30%,65%{opacity:1}}
      @keyframes calcium{0%,12%,42%,100%{opacity:0;transform:translate(0,0)}16%{opacity:1;transform:translate(0,0)}32%{opacity:1;transform:translate(0,-105px)}36%{opacity:0;transform:translate(0,-105px)}}
      @keyframes releaseA{0%,33%,100%{opacity:0;transform:translate(0,0)}36%{opacity:1;transform:translate(0,0)}60%{opacity:0;transform:translate(-26px,22px)}}
      @keyframes releaseB{0%,36%,100%{opacity:0;transform:translate(0,0)}39%{opacity:1;transform:translate(0,0)}63%{opacity:0;transform:translate(0,18px)}}
      @keyframes releaseC{0%,39%,100%{opacity:0;transform:translate(0,0)}42%{opacity:1;transform:translate(0,0)}66%{opacity:0;transform:translate(27px,21px)}}
      @keyframes bud{0%,65%,100%{opacity:0;transform:translate(0,0)}73%{opacity:1;transform:translate(0,0)}88%{opacity:1;transform:translate(0,-64px)}96%{opacity:0;transform:translate(0,-64px)}}@keyframes retrieval{0%,66%,100%{opacity:1}76%,94%{opacity:.25}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}.docked,.bridge{opacity:0}.fusion,.calcium,.release-a,.release-b,.release-c,.bud{opacity:1}.bud{transform:translate(0,-50px)}}
    </style>
  </defs>
  <rect x="1" y="1" width="1278" height="458" rx="22" fill="url(#bg)" stroke="#2B3357" stroke-width="2"/>
  <circle cx="34" cy="32" r="5" fill="#FF6B6B"/><circle cx="53" cy="32" r="5" fill="#FFD166"/><circle cx="72" cy="32" r="5" fill="#2ED573"/>
  <text x="97" y="39" fill="#F4F7FF" class="mono" font-size="21" font-weight="700">vesicle_cycle.svg</text><text x="1244" y="39" text-anchor="end" fill="#FFD84D" class="mono" font-size="14">ONE CYCLE · MANY QUESTIONS</text><path d="M26 61H1254" stroke="#2B3357"/>
  <g transform="translate(36 78)" data-panel="organization">
    <rect data-panel-boundary="true" width="388" height="326" rx="15" fill="#141B2B" stroke="#5A4A26"/>
    <text x="20" y="25" fill="#FFD84D" class="mono" font-size="14">01 / RESEARCH FOCUS</text><text x="20" y="57" fill="#F4F7FF" font-size="26" font-weight="700">Move &amp; organize</text>
    <ellipse cx="194" cy="162" rx="143" ry="81" fill="#FFD84D" fill-opacity=".025" stroke="#FFD84D" stroke-opacity=".2" stroke-dasharray="4 7"/>
    <g class="links" stroke="#B176FF" stroke-width="2" stroke-dasharray="3 4"><path d="M121 145L155 126M183 129L213 145M133 168L154 194M181 199L235 193M253 168L269 138"/><g fill="#B176FF" stroke="none"><circle cx="139" cy="136" r="4.5"/><circle cx="199" cy="137" r="4.5"/><circle cx="144" cy="181" r="4.5"/><circle cx="207" cy="196" r="4.5"/><circle cx="261" cy="153" r="4.5"/></g></g>
    <g transform="translate(100 153)"><g class="drift-a"><use href="#sv"/></g></g><g transform="translate(175 118)"><g class="drift-b"><use href="#sv"/></g></g><g transform="translate(234 155)"><g class="drift-a"><use href="#sv"/></g></g><g transform="translate(281 117)"><g class="drift-b"><use href="#sv"/></g></g><g transform="translate(166 205)"><g class="drift-b"><use href="#sv"/></g></g><g transform="translate(256 199)"><g class="drift-a"><use href="#sv"/></g></g>
    <text x="20" y="273" fill="#FFEAAF" font-size="20">Vesicles + synapsin</text><text x="20" y="300" fill="#A7B1D8" font-size="16">Motion · interactions · organization</text>
  </g>
  <g transform="translate(446 78)" data-panel="exocytosis">
    <rect data-panel-boundary="true" width="388" height="326" rx="15" fill="#19192C" stroke="#56314D"/>
    <text x="20" y="25" fill="#FF8FD8" class="mono" font-size="14">02 / BIOLOGICAL CONTEXT</text><text x="20" y="57" fill="#F4F7FF" font-size="25" font-weight="700">Dock → fuse → release</text>
    <rect x="20" y="81" width="348" height="132" rx="10" fill="#0B1120"/>
    <path d="M20 211H142M214 211H368M20 218H142M214 218H368" stroke="#8A8BFF" stroke-width="2.5"/><path d="M138 211H215" stroke="#FF8FD8" stroke-width="5" class="bridge"/>
    <g transform="translate(176 186)" class="docked"><use href="#sv"/></g>
    <path class="fusion" d="M139 211H151C159 211 159 205 154 199C136 176 150 149 176 149C202 149 216 176 198 199C193 205 193 211 201 211H216" stroke="#FFD84D" stroke-width="3" stroke-linecap="round" fill="#FFD84D" fill-opacity=".05"/>
    <rect x="271" y="203" width="15" height="24" rx="4" fill="#142A3B" stroke="#53D8FF" stroke-width="2"/><path d="M279 254V163" stroke="#53D8FF" stroke-opacity=".35" stroke-dasharray="3 5" marker-end="url(#arrow)"/><text x="299" y="179" fill="#53D8FF" font-size="19">Ca²⁺</text>
    <circle cx="277" cy="242" r="5" fill="#53D8FF" class="calcium"/><circle cx="281" cy="247" r="4" fill="#A7EEFF" class="calcium calcium-b"/>
    <circle cx="170" cy="221" r="4" fill="#FFD84D" class="release-a"/><circle cx="178" cy="228" r="3.5" fill="#FFEAAF" class="release-b"/><circle cx="183" cy="223" r="3.5" fill="#FFD84D" class="release-c"/>
    <text x="20" y="244" fill="#8290B5" font-size="13">synaptic cleft</text>
    <text x="20" y="273" fill="#FFB8E7" font-size="20">Ca²⁺-triggered exocytosis</text><text x="20" y="300" fill="#A7B1D8" font-size="16">Docking · priming · membrane fusion</text>
  </g>
  <g transform="translate(856 78)" data-panel="recycling">
    <rect data-panel-boundary="true" width="388" height="326" rx="15" fill="#14231F" stroke="#345B48"/>
    <text x="20" y="25" fill="#8FFFA3" class="mono" font-size="14">03 / BIOLOGICAL CONTEXT</text><text x="20" y="57" fill="#F4F7FF" font-size="26" font-weight="700">Recycle &amp; reuse</text>
    <path d="M20 211H147C157 211 159 202 158 191C156 174 167 160 185 160C204 160 215 174 212 191C211 202 217 211 226 211H368" stroke="#8FFFA3" stroke-width="3" class="retrieval"/>
    <path d="M20 218H144M230 218H368" stroke="#8FFFA3" stroke-opacity=".45" stroke-width="2"/>
    <g class="bud"><g transform="translate(185 178)"><use href="#sv"/></g></g>
    <path d="M287 199C311 166 300 133 270 124" stroke="#8FFFA3" stroke-opacity=".6" stroke-width="2" stroke-dasharray="4 5"/><path d="M280 119L268 124L275 134" stroke="#8FFFA3" stroke-width="2"/>
    <text x="20" y="273" fill="#B7FFC5" font-size="20">Membrane retrieval + recycling</text><text x="20" y="300" fill="#A7B1D8" font-size="16">Endocytosis · reformation · refilling</text>
  </g>
  <text x="36" y="437" fill="#A7B1D8" font-size="15">Conceptual cycle · not to scale · recycling routes are simplified</text><text x="1244" y="437" text-anchor="end" fill="#FFD84D" class="mono" font-size="14">Motion + organization = my research focus</text>
</svg>
