  <rect x="1" y="1" width="558" height="480" rx="20" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <path d="M65 61V405" stroke="url(#path)" stroke-width="3"/>
  <g fill="#94A3B8"><path d="M65 113L59 104H71Z"/><path d="M65 199L59 190H71Z"/><path d="M65 285L59 276H71Z"/><path d="M65 371L59 362H71Z"/></g>
