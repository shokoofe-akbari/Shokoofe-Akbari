    <text x="116" y="135" fill="#7DD3FC" font-size="18" font-weight="700" letter-spacing="1.5">SIMULATE</text><text x="116" y="158" fill="#CBD5E1" font-size="14">controlled computational experiments</text><text x="116" y="178" fill="#94A3B8" font-size="11">trajectories · forces · events</text>
    <circle cx="65" cy="233" r="26" fill="#20183B" stroke="#8B5CF6" stroke-width="2"/><path d="M53 233L62 242L79 221" stroke="#C4B5FD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
