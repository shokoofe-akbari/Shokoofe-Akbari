    <text x="116" y="49" fill="#67E8F9" font-size="18" font-weight="700" letter-spacing="1.5">MODEL</text><text x="116" y="72" fill="#CBD5E1" font-size="14">explicit mechanisms</text><text x="116" y="92" fill="#94A3B8" font-size="11">assumptions · scales · constraints</text>
