<svg xmlns="http://www.w3.org/2000/svg" width="440" height="902" viewBox="0 0 440 902" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Shokoofeh's workbench — mobile</title>
  <desc id="desc">A colorful six-lane personal workspace for research, build, teach, learn and automate, create, and write. This is an illustration, not a measured activity report.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="440" y2="902" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#14192F"/></linearGradient></defs>
  <rect x="1" y="1" width="438" height="900" rx="20" fill="url(#bg)" stroke="#2B3357" stroke-width="2"/>
