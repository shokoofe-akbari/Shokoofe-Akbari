      <text x="40" y="611" fill="#FF8FD8" font-size="13" letter-spacing="0.7">05 / CREATE</text><text x="40" y="644" fill="#F4F7FF" font-size="21" font-weight="700">Science with a visual voice.</text><text x="40" y="673" fill="#A7B1D8" font-size="16">BugCharm · dark themes</text><text x="40" y="692" fill="#A7B1D8" font-size="16">Clear stories</text>
