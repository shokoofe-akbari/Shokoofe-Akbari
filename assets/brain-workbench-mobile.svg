      <text x="40" y="740" fill="#FDBA74" font-size="13" letter-spacing="0.7">06 / WRITE</text><text x="40" y="773" fill="#F4F7FF" font-size="21" font-weight="700">Give ideas a good page.</text><text x="40" y="802" fill="#A7B1D8" font-size="16">Models · LaTeX · manuscripts</text><text x="40" y="821" fill="#A7B1D8" font-size="16">Book ideas</text>
