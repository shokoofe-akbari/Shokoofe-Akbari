      <text x="40" y="482" fill="#8FFFA3" font-size="13" letter-spacing="0.7">04 / LEARN &amp; AUTOMATE</text><text x="40" y="515" fill="#F4F7FF" font-size="21" font-weight="700">One more useful rabbit hole.</text><text x="40" y="544" fill="#A7B1D8" font-size="16">LLMs · n8n</text><text x="40" y="563" fill="#A7B1D8" font-size="16">Scientific workflows</text>
