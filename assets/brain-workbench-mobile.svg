      <text x="40" y="353" fill="#C8A2FF" font-size="13" letter-spacing="0.7">03 / TEACH</text><text x="40" y="386" fill="#F4F7FF" font-size="21" font-weight="700">Make the concept click.</text><text x="40" y="415" fill="#A7B1D8" font-size="16">Git · GitHub · AI</text><text x="40" y="434" fill="#A7B1D8" font-size="16">Practical learning</text>
