      <text x="40" y="244" fill="#53D8FF" font-size="13" letter-spacing="0.7">02 / BUILD</text><text x="40" y="277" fill="#F4F7FF" font-size="21" font-weight="700">Ideas with source code.</text><text x="40" y="302" fill="#A7B1D8" font-size="16">C++ · Python · scientific tools</text>
