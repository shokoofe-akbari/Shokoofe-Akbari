      <text x="40" y="115" fill="#FFD84D" font-size="13" letter-spacing="0.7">01 / RESEARCH</text>
      <text x="40" y="148" fill="#F4F7FF" font-size="21" font-weight="700">Tiny vesicles. Big questions.</text>
      <text x="40" y="177" fill="#A7B1D8" font-size="16">Mechanisms · models</text><text x="40" y="196" fill="#A7B1D8" font-size="16">Numerical evidence</text>
