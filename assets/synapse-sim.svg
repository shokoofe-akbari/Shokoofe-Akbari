<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Shokoofeh's synaptic vesicle lab</title>
  <desc id="desc">An animated code-editor illustration of a presynaptic terminal. Gold double-ring vesicles move gently in the terminal, purple dots represent synapsin, and docked vesicles sit above a pink active zone. The code, motion and geometry are conceptual, not executable code or simulation results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="660" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1020"/><stop offset="0.55" stop-color="#12162B"/><stop offset="1" stop-color="#0A0E1A"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#151B30"/><stop offset="1" stop-color="#0E1323"/></linearGradient>
    <linearGradient id="membrane" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#777AFF"/><stop offset="0.5" stop-color="#B176FF"/><stop offset="1" stop-color="#53D8FF"/></linearGradient>
    <radialGradient id="vesicle"><stop stop-color="#FFD84D" stop-opacity="0.2"/><stop offset="1" stop-color="#FFD84D" stop-opacity="0.05"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <g id="sv"><circle r="23" fill="url(#vesicle)" stroke="#FFD84D" stroke-width="3"/><circle r="18" stroke="#FFEAAF" stroke-opacity="0.55" stroke-width="1.2"/><circle cx="-6" cy="-4" r="3" fill="#FFD84D"/><circle cx="6" cy="-2" r="3" fill="#FFD84D"/><circle cy="7" r="3" fill="#FFD84D"/></g>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif} .mono{font-family:Consolas,Menlo,monospace} .muted{fill:#A7B1D8} .code{font:19px Consolas,Menlo,monospace;fill:#E7ECFF} .ln{font:15px Consolas,Menlo,monospace;fill:#677397}
      .drift-a{animation:driftA 6s ease-in-out infinite}.drift-b{animation:driftB 4s ease-in-out infinite}.drift-c{animation:driftC 3s ease-in-out infinite}.links{animation:links 6s ease-in-out infinite}.flow{animation:flow 6s linear infinite}.cursor{animation:cursor 1.5s step-end infinite}.scan{animation:scan 4s ease-in-out infinite}
      @keyframes driftA{0%,100%{transform:translate(0,0)}25%{transform:translate(4px,-6px)}55%{transform:translate(-3px,3px)}80%{transform:translate(2px,5px)}}
      @keyframes driftB{0%,100%{transform:translate(0,0)}27%{transform:translate(-5px,2px)}62%{transform:translate(3px,-5px)}82%{transform:translate(5px,3px)}}
      @keyframes driftC{0%,100%{transform:translate(0,0)}32%{transform:translate(-4px,-4px)}68%{transform:translate(5px,4px)}}
      @keyframes links{0%,100%{opacity:.5}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-28}}@keyframes cursor{0%,100%{opacity:1}50%{opacity:0}}@keyframes scan{0%,100%{opacity:.08}50%{opacity:.2}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect x="1" y="1" width="1278" height="658" rx="26" fill="url(#bg)" stroke="#2B3357" stroke-width="2"/>
  <g data-panel="header">
    <rect data-panel-boundary="true" x="20" y="20" width="1240" height="67" rx="16" fill="#1B223D"/>
    <circle cx="45" cy="45" r="6" fill="#FF6B6B"/><circle cx="65" cy="45" r="6" fill="#FFD166"/><circle cx="85" cy="45" r="6" fill="#2ED573"/>
    <text x="111" y="50" fill="#F4F7FF" font-size="25" font-weight="700">synapse_sim.cpp</text>
    <text x="111" y="74" class="muted" font-size="15">Shokoofeh Akbari · mathematics meets a tiny biological world</text>
    <rect x="978" y="34" width="263" height="35" rx="17.5" fill="#FFD84D"/>
    <text x="1109.5" y="57" text-anchor="middle" class="mono" fill="#12162B" font-size="16" font-weight="700">SYNAPTIC VESICLE LAB</text>
  </g>
  <g data-panel="editor" xml:space="preserve">
    <rect data-panel-boundary="true" x="36" y="103" width="456" height="413" rx="17" fill="url(#panel)" stroke="#303B60"/>
    <text x="59" y="135" class="mono" fill="#F4F7FF" font-size="18" font-weight="700">model.cpp</text>
    <rect x="260" y="114" width="207" height="28" rx="7" fill="#222B48"/>
    <text x="363.5" y="133" text-anchor="middle" class="mono muted" font-size="14">illustrative C++</text>
    <path d="M54 153H474" stroke="#2B3357"/>
    <path d="M76 172V439" stroke="#273050"/>
    <rect x="82" y="365" width="386" height="28" rx="5" fill="#53D8FF" opacity=".1" class="scan"/>
    <text x="57" y="190" class="ln">1</text><text x="91" y="190" class="code"><tspan fill="#8290B5">// agents × mechanisms</tspan></text>
    <text x="57" y="222" class="ln">2</text><text x="91" y="222" class="code"><tspan fill="#FF8FD8">struct</tspan><tspan fill="#53D8FF"> SynapticVesicle </tspan><tspan>{</tspan></text>
    <text x="57" y="254" class="ln">3</text><text x="91" y="254" class="code"><tspan fill="#53D8FF">  Vec3</tspan><tspan> position;</tspan></text>
    <text x="57" y="286" class="ln">4</text><text x="91" y="286" class="code"><tspan fill="#FF8FD8">  double</tspan><tspan> radius;</tspan></text>
    <text x="57" y="318" class="ln">5</text><text x="91" y="318" class="code">};</text>
    <text x="57" y="350" class="ln">6</text><text x="91" y="350" class="code"><tspan fill="#FFD84D">simulate</tspan><tspan>(motion, interactions);</tspan></text>
    <text x="57" y="382" class="ln">7</text><text x="91" y="382" class="code"><tspan fill="#FFD84D">measure</tspan><tspan>(observables);</tspan></text>
    <text x="57" y="414" class="ln">8</text><text x="91" y="414" class="code"><tspan fill="#FFD84D">validate</tspan><tspan>(numerics);</tspan></text>
    <text x="59" y="470" fill="#8FFFA3" class="mono" font-size="15">AGENT-BASED · STOCHASTIC</text>
    <text x="59" y="496" class="muted" font-size="15">A model sketch, not executable source.</text>
  </g>
  <g data-panel="terminal">
    <rect data-panel-boundary="true" x="516" y="103" width="728" height="413" rx="17" fill="url(#panel)" stroke="#303B60"/>
    <text x="541" y="135" fill="#F4F7FF" font-size="20" font-weight="700">Presynaptic terminal</text>
    <text x="1220" y="135" text-anchor="end" class="mono" fill="#BDA2FF" font-size="15">VESICLES × SYNAPSIN</text>
    <path d="M557 423V286C557 210 631 172 731 172H1041C1145 172 1205 218 1205 296V423Z" fill="#0B1120" stroke="#3A466C" stroke-width="2"/>
    <path class="flow" d="M621 252C650 201 710 197 753 233S807 289 858 260S965 211 1019 270" stroke="#FFD84D" stroke-opacity=".2" stroke-dasharray="4 10" stroke-width="2"/>
    <g class="links" stroke="#B176FF" stroke-width="2" stroke-dasharray="3 5">
      <path d="M700 245L742 226M780 229L818 246M749 296L804 309M831 295L900 275M746 293L755 249"/>
      <g fill="#B176FF" stroke="none" filter="url(#glow)"><circle cx="721" cy="235" r="5"/><circle cx="799" cy="238" r="5"/><circle cx="779" cy="303" r="5"/><circle cx="866" cy="285" r="5"/><circle cx="751" cy="271" r="5"/></g>
    </g>
    <g transform="translate(678 244)"><g class="drift-a"><use href="#sv"/></g></g>
    <g transform="translate(764 225)"><g class="drift-b"><use href="#sv"/></g></g>
    <g transform="translate(842 252)"><g class="drift-c"><use href="#sv"/></g></g>
    <g transform="translate(727 312)"><g class="drift-b"><use href="#sv"/></g></g>
    <g transform="translate(823 321)"><g class="drift-a"><use href="#sv"/></g></g>
    <g transform="translate(922 272)"><g class="drift-c"><use href="#sv"/></g></g>
    <g transform="translate(1070 282)"><g class="drift-b"><use href="#sv"/></g></g>
    <text x="1031" y="211" fill="#FFEAAF" font-size="19">Vesicle pool</text><path d="M1072 219V251" stroke="#FFD84D" stroke-opacity=".6"/>
    <text x="582" y="374" fill="#C8A2FF" font-size="19">Synapsin</text><path d="M666 366L744 354L779 310" stroke="#B176FF" stroke-opacity=".7"/>
    <g transform="translate(902 394)"><use href="#sv"/></g><g transform="translate(983 394)"><use href="#sv"/></g>
    <path d="M557 423H1205M557 430H1205" stroke="url(#membrane)" stroke-width="3"/>
    <path d="M864 423H1022" stroke="#FF8FD8" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
    <text x="909" y="474" fill="#FFB8E7" font-size="19" text-anchor="middle">Active zone</text><path d="M909 453V435" stroke="#FF8FD8" stroke-opacity=".7"/>
    <text x="1140" y="474" fill="#A7B1D8" font-size="19" text-anchor="middle">Membrane</text><path d="M1140 453V437" stroke="#8998C3" stroke-opacity=".7"/>
    <text x="553" y="495" class="muted" font-size="15">Not to scale · motion is illustrative</text>
  </g>
  <g data-panel="console">
    <rect data-panel-boundary="true" x="36" y="536" width="1208" height="96" rx="17" fill="url(#panel)" stroke="#303B60"/>
    <text x="59" y="568" fill="#8FFFA3" class="mono" font-size="18">shokoofeh@lab:~$ inspect vesicle-cycle</text><rect class="cursor" x="443" y="552" width="9" height="20" rx="1" fill="#FFD84D"/>
    <text x="1220" y="568" text-anchor="end" fill="#BDA2FF" class="mono" font-size="15">MODEL SKETCH</text>
    <circle cx="66" cy="603" r="8" stroke="#FFD84D" stroke-width="2"/><circle cx="66" cy="603" r="4.5" stroke="#FFEAAF" stroke-opacity=".6"/><text x="84" y="610" fill="#FFEAAF" font-size="17">synaptic vesicle</text>
    <circle cx="277" cy="603" r="5" fill="#B176FF" filter="url(#glow)"/><text x="292" y="610" fill="#C8A2FF" font-size="17">synapsin</text>
    <text x="1220" y="610" text-anchor="end" class="muted" font-size="16">Conceptual illustration · not simulation data</text>
  </g>
</svg>
