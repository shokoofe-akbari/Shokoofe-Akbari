name: Generate GitHub Trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  generate-trophies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Create assets directory
        run: mkdir -p assets

      - name: Check trophy token
        shell: bash
        env:
          TROPHY_PAT: ${{ secrets.TROPHY_PAT }}
        run: |
          if [ -z "$TROPHY_PAT" ]; then
            echo "::error::Repository secret TROPHY_PAT is missing."
            echo "Create it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          token: ${{ secrets.TROPHY_PAT }}
          username: shokoofe-akbari
          file: assets/github-trophies.svg
          theme: onedark
          max-cols: "7"
          max-rows: "2"
          no-frame: "true"

      - name: Verify generated SVG
        run: |
          test -s assets/github-trophies.svg
          echo "Trophy SVG generated successfully:"
          ls -lh assets/github-trophies.svg

      - name: Commit updated trophy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-trophies.svg
          if git diff --cached --quiet; then
            echo "No trophy changes to commit."
          else
            git commit -m "chore: update GitHub trophies"
            git push
          fi
